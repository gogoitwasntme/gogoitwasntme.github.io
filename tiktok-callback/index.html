<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>GOGO Publisher sign-in</title>
<style>
:root { --bg: #fff7d6; --fg: #1d2233; --muted: #5a6075; }
@media (prefers-color-scheme: dark) { :root { --bg: #141726; --fg: #eef0f7; --muted: #a8aec4; color-scheme: dark } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
  background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; padding: 24px 16px; }
p { margin: 6px 0; } .muted { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <p id="msg"><strong>Finishing the TikTok sign-in…</strong></p>
  <p class="muted" id="hint">This page passes the sign-in back to the GOGO Publisher app on this computer.</p>
</main>
<script>
// Relay for TikTok Login Kit: TikTok only accepts https redirect URIs, so it sends the user here
// and this page forwards the answer to the local `gogo tt login` listener. The destination is fixed
// to localhost (never taken from the URL), and the code is useless without the app's secret and PKCE verifier.
(function () {
  var q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) {
    document.getElementById("msg").innerHTML = "<strong>Nothing to do here.</strong>";
    document.getElementById("hint").textContent = "Start the sign-in from the GOGO app with: gogo tt login";
    return;
  }
  var keep = new URLSearchParams();
  ["code", "state", "scopes", "error", "error_description"].forEach(function (k) {
    if (q.has(k)) keep.set(k, q.get(k));
  });
  document.getElementById("hint").textContent =
    "If nothing happens, make sure `gogo tt login` is still running in the terminal.";
  location.replace("http://localhost:8765/callback/?" + keep.toString());
})();
</script>
</body>
</html>
